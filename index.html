<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>김채연 포트폴리오</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a quiet personal directory. A fanned stack of work thumbnails on top, a narrow centered column for the intro, search and list,
   filters in a left rail on wide screens. Neutral base (~70%), one ink tone for text (~20%), a single blue for the selected state (~10%). */
:root{
  --bg:#fafafa; --surface:#f0f0f1; --raised:#ffffff; --text:#18181b; --muted:#71717a; --faint:#a1a1aa; --line:#e4e4e7; --accent:#2563eb;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);
  --font:"Inter","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0c0d; --surface:#18181b; --raised:#1f1f23; --text:#f4f4f5; --muted:#a1a1aa; --faint:#71717a; --line:#27272a; --accent:#60a5fa;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0c0d; --surface:#18181b; --raised:#1f1f23; --text:#f4f4f5; --muted:#a1a1aa; --faint:#71717a; --line:#27272a; --accent:#60a5fa;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 120px}
p,h1,h2,h3{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* theme switch */
.theme{display:flex;justify-content:center}
.theme div{display:inline-flex;gap:2px;padding:3px;background:var(--surface);border-radius:999px}
.theme button{appearance:none;border:none;background:transparent;width:30px;height:26px;border-radius:999px;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.theme button[aria-pressed="true"]{background:var(--raised);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.theme svg{width:15px;height:15px}

/* fan */
.fan{position:relative;height:190px;margin:56px auto 60px;max-width:460px}
.fan button{appearance:none;border:3px solid var(--raised);padding:0;position:absolute;top:10px;left:50%;width:150px;aspect-ratio:640/420;max-width:100%;
  border-radius:8px;overflow:hidden;cursor:pointer;background:var(--surface);box-shadow:var(--shadow);transition:transform .2s ease}
.fan img{width:100%;height:100%;object-fit:cover;display:block}
.fan button:nth-child(1){transform:translateX(-215px) translateY(18px) rotate(-10deg);z-index:1}
.fan button:nth-child(2){transform:translateX(-160px) translateY(6px) rotate(-5deg);z-index:2}
.fan button:nth-child(3){transform:translateX(-50%) scale(1.15);z-index:5}
.fan button:nth-child(4){transform:translateX(10px) translateY(6px) rotate(5deg);z-index:2}
.fan button:nth-child(5){transform:translateX(65px) translateY(18px) rotate(10deg);z-index:1}
.fan button:hover{z-index:9}
.fan button:nth-child(1):hover{transform:translateX(-215px) translateY(8px) rotate(-10deg)}
.fan button:nth-child(2):hover{transform:translateX(-160px) translateY(-4px) rotate(-5deg)}
.fan button:nth-child(3):hover{transform:translateX(-50%) translateY(-8px) scale(1.15)}
.fan button:nth-child(4):hover{transform:translateX(10px) translateY(-4px) rotate(5deg)}
.fan button:nth-child(5):hover{transform:translateX(65px) translateY(8px) rotate(10deg)}

/* layout */
.layout{max-width:860px;margin:0 auto;display:grid;grid-template-columns:1fr minmax(0,420px) 1fr;column-gap:40px}
.rail{grid-column:1;justify-self:end;width:140px}
.rail ul{list-style:none;margin:0;padding:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);display:flex;flex-direction:column;gap:6px}
.rail button{appearance:none;border:none;background:none;padding:2px 0;cursor:pointer;color:var(--faint);font-size:14px;display:flex;gap:8px;align-items:center}
.rail button:hover{color:var(--text)}
.rail button[aria-pressed="true"]{color:var(--text)}
.rail button[aria-pressed="true"]::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--text)}
.main{grid-column:2;min-width:0;display:flex;flex-direction:column}

.intro{display:flex;flex-direction:column;gap:20px;color:var(--muted);font-size:15px}
.intro b{color:var(--text);font-weight:600}
.chip{appearance:none;border:none;background:var(--surface);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:13.5px;cursor:pointer;text-decoration:none;display:inline-block}
.chip:hover{color:var(--text)}
.links{margin-top:22px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.links .lab{display:flex;gap:8px;align-items:center;color:var(--faint);font-size:13px}
.links .lab .chip{font-size:12px;padding:1px 7px}
.links a{color:var(--text);text-decoration:none}
.links a span{color:var(--muted)}
.links a:hover span{color:var(--text)}
.ext{width:11px;height:11px;vertical-align:0;margin-left:3px;color:var(--faint)}
hr{border:none;border-top:1px solid var(--line);margin:36px 0 36px}

/* controls */
.tools{display:flex;gap:8px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:8px;padding:0 8px 0 10px;min-width:0}
.search svg{width:15px;height:15px;color:var(--faint);flex:none}
.search input{flex:1;min-width:0;border:none;background:transparent;padding:9px 0;font:inherit;font-size:14px;color:var(--text);outline:none}
.search input::placeholder{color:var(--faint)}
.search:focus-within{box-shadow:0 0 0 2px var(--accent)}
.kbd{font-size:11.5px;color:var(--faint);background:var(--raised);border-radius:4px;padding:0 6px;line-height:18px}
.views{display:inline-flex;gap:2px;padding:3px;background:var(--surface);border-radius:8px}
.views button{appearance:none;border:none;background:transparent;width:30px;border-radius:6px;display:grid;place-items:center;color:var(--faint);cursor:pointer}
.views button[aria-pressed="true"]{background:var(--raised);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.views svg{width:15px;height:15px}
.tabs{margin-top:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:3px;background:var(--surface);border-radius:8px}
.tabs button{appearance:none;border:none;background:transparent;border-radius:6px;padding:5px 4px;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--raised);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* list */
.list{list-style:none;margin:28px 0 0;padding:0;display:flex;flex-direction:column}
.list button{appearance:none;border:none;background:none;width:100%;text-align:left;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px 6px;margin:0 -6px;border-radius:6px;width:calc(100% + 12px)}
.list button:hover{background:var(--surface)}
.list .nm{font-weight:500;white-space:nowrap;font-size:14.5px}
.list .ds{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.list .dt{color:var(--faint);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.grid{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}
.grid button{appearance:none;border:none;background:none;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;width:100%}
.grid img{width:100%;aspect-ratio:640/420;object-fit:cover;border-radius:8px;background:var(--surface);display:block}
.grid button:hover img{box-shadow:var(--shadow)}
.grid .nm{font-weight:500;font-size:14px;line-height:1.4}
.grid .dt{color:var(--faint);font-size:12.5px}
.empty{margin-top:28px;color:var(--muted);font-size:14px}

.surprise{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);appearance:none;border:none;background:var(--raised);color:var(--text);
  border-radius:999px;padding:8px 16px;font-size:14px;font-weight:500;box-shadow:var(--shadow);cursor:pointer;z-index:20}
.fade{position:fixed;left:0;right:0;bottom:0;height:120px;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg));z-index:15}

/* detail */
dialog{border:none;padding:0;background:var(--raised);color:var(--text);border-radius:12px;width:min(600px,calc(100vw - 32px));max-height:calc(100dvh - 48px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.d-in{display:flex;flex-direction:column;gap:18px;padding:22px 24px 26px;overflow:auto;max-height:calc(100dvh - 48px)}
.d-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.d-top .dt{color:var(--faint);font-size:13px}
.close{appearance:none;border:none;background:var(--surface);border-radius:6px;padding:3px 10px;font-size:13.5px;cursor:pointer;color:var(--muted)}
.close:hover{color:var(--text)}
.d-img{width:100%;aspect-ratio:640/420;object-fit:cover;border-radius:8px;display:block;background:var(--surface)}
.d-in h2{font-size:21px;font-weight:600;line-height:1.35;text-wrap:balance}
.d-meta{color:var(--muted);font-size:14px;margin-top:4px}
.d-body{display:flex;flex-direction:column;gap:14px;font-size:14.5px}
.d-body h3{font-size:14px;font-weight:600;margin-bottom:4px}
.d-body ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.d-body li::marker{color:var(--faint)}
.d-body .mine{color:var(--accent);font-weight:500}
.d-nums{display:flex;flex-wrap:wrap;gap:8px 28px}
.d-nums div{display:flex;flex-direction:column}
.d-nums strong{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.d-nums span{font-size:12.5px;color:var(--muted)}
.d-body table{border-collapse:collapse;width:100%;font-size:13.5px}
.d-body td,.d-body th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.d-body th{font-weight:500;color:var(--muted)}
.d-links{display:flex;flex-wrap:wrap;gap:8px}
.d-links a{background:var(--surface);border-radius:6px;padding:4px 10px;font-size:13.5px;text-decoration:none}
.d-links a:hover{background:var(--line)}

@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);max-width:480px}
  .rail{grid-column:1;justify-self:stretch;width:auto;margin-bottom:24px;order:2}
  .rail ul{position:static;flex-direction:row;flex-wrap:wrap;gap:4px 16px}
  .main{grid-column:1;order:1}
  .rail{order:0}
}
@media (max-width:480px){
  .fan{transform:scale(.72);margin:36px auto 28px;height:160px}
  .list button{grid-template-columns:minmax(0,1fr) auto}
  .list .ds{grid-column:1 / -1;grid-row:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="theme"><div role="group" aria-label="화면 테마">
  <button type="button" id="th-light" aria-label="밝게"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <button type="button" id="th-dark" aria-label="어둡게"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</div></div>

<div class="fan" id="fan"></div>

<div class="layout">
  <nav class="rail" aria-label="분야"><ul id="cats"></ul></nav>
  <div class="main">
    <section class="intro">
      <p>안녕하세요,</p>
      <p>저는 <b>김채연</b>입니다. AI 모델을 서비스에 붙여 보고, 클라우드 운영 환경을 구축하고, 공공 데이터로 질문을 검증해 왔습니다. 만든 것이 실제로 의도대로 동작하는지 확인하는 일을 좋아합니다.</p>
      <p><b id="count">0</b>개의 작업과 기록을 모았습니다. 궁금한 점은 <button type="button" class="chip" id="copy">kim.c.chaeyeon@gmail.com</button></p>
    </section>
    <div class="links">
      <div class="lab">바로 가기 <span class="chip">외부 링크</span></div>
      <a href="https://github.com/k1mchaeyeon"><b>GitHub</b><span>: 코드와 프로젝트 기록</span><svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
      <a href="https://youtu.be/GlBnGxDe_Iw"><b>LogiIQ 시연 영상</b><span>: 졸업작품 데모</span><svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
    </div>

    <hr>

    <div class="tools">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="작업 검색" aria-label="작업 검색" autocomplete="off"><span class="kbd" aria-hidden="true">/</span></label>
      <div class="views" role="group" aria-label="보기 방식">
        <button type="button" id="v-list" aria-label="목록으로 보기" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <button type="button" id="v-grid" aria-label="썸네일로 보기" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
      </div>
    </div>
    <div class="tabs" role="group" aria-label="종류" id="tabs"></div>

    <ul class="list" id="out"></ul>
    <p class="empty" id="empty" hidden>찾는 작업이 없습니다. 검색어를 줄이거나 분야를 '전체'로 바꿔 보세요.</p>
  </div>
</div>

<div class="fade" aria-hidden="true"></div>
<button type="button" class="surprise" id="rand">아무거나 보기</button>

<dialog id="dlg" aria-labelledby="d-title">
  <div class="d-in">
    <div class="d-top"><span class="dt" id="d-date"></span><button type="button" class="close" id="d-close">닫기</button></div>
    <img class="d-img" id="d-img" alt="">
    <div><h2 id="d-title"></h2><p class="d-meta" id="d-meta"></p></div>
    <div class="d-body" id="d-body"></div>
    <div class="d-links" id="d-links"></div>
  </div>
</dialog>

 body:'<table><tbody><tr><th>담당 범위</th><td>데이터 준비 · 청킹 · 임베딩 · 벡터 DB 적재 · BM25/벡터/하이브리드 검색기 · 평가 설계 (전부 혼자)</td></tr><tr><th>기술</th><td>Python, Qdrant(코사인 거리), BM25, multilingual-e5-small, RRF, Streamlit, KorQuAD 1.0</td></tr></tbody></table>'+
 '<div><h3>목표</h3><p>LogiIQ의 AI 캐릭터가 근거 없이 엉뚱하게 답하던 문제에서 출발했습니다. 답을 만들기 전에 근거 문단을 찾아 주는 검색 단계가 질문 500개 중 정답 문단을 상위 5개 안에 얼마나 넣는지(Hit@5)를 기준으로 가장 나은 청크 크기와 검색 방식을 고르는 것이 목표였습니다.</p></div>'+
 '<div><h3>수행</h3><ul><li>KorQuAD 1.0 dev를 문서 140편(약 52만 자)과 평가 질문 500개로 정리하고, 정답의 문서 내 위치를 저장</li><li>문장 끝에서 끊는 청크 분할(300·600·1000자, 앞 청크와 20% 겹침)</li><li>e5 임베딩(query:/passage: 접두어) → Qdrant 적재, BM25(글자 2개 단위), 두 순위를 RRF로 합치는 하이브리드</li><li>청크 크기 × 검색 방식 9개 조합별 Hit@1 · Hit@5 · MRR@10 · 질문당 검색 시간 측정</li></ul></div>'+
 '<div><h3>문제 → 개선</h3><p>글자 n-gram 해시로 만든 벡터 검색 기준선은 Hit@5 0.772에 그쳤습니다. 의미를 담는 e5 임베딩으로 바꾸자 0.924로 올랐고, BM25와 RRF로 합친 하이브리드는 0.976까지 올랐습니다(600자 기준).</p></div>'+
 '<div class="d-nums"><div><strong>0.772 → 0.976</strong><span>Hit@5, 해시 벡터 → e5 하이브리드</span></div><div><strong>0.936</strong><span>최고 MRR@10 (BM25 · 1000자)</span></div><div><strong>1.2ms</strong><span>질문당 검색 시간 (BM25 · 1000자)</span></div></div>'+
 '<div><h3>결과와 다음 단계</h3><p>이 데이터에서는 BM25가 모든 조합에서 가장 높았습니다. 질문이 위키 문장을 보고 만들어져 문서와 단어가 많이 겹치기 때문입니다. 검색 방식은 데이터를 보고 숫자로 골라야 한다는 것을 확인했습니다. 하이브리드 가중치 조정, 재정렬(re-ranker), 다르게 바꿔 쓴 질문 세트 재실험, 생성 단계 연결은 다음 단계입니다.</p></div>',
 links:[["GitHub 저장소","https://github.com/k1mchaeyeon/korean-rag-retrieval-benchmark"]]},
{id:"cdw",nm:"외부 API 5종 연동 실시간 데이터 수집 파이프라인",ds:"연쇄 지연 워치: 인천공항 지연이 같은 기체의 다음 편으로 번지는지 보여 주는 대시보드",dt:"2026.11",kind:"project",cats:["data","cloud"],img:"cdw",
 meta:"개인 프로젝트, 2026.11 ~ 운영 중 · 강조 구간: 외부 데이터 연동과 자동 수집 · 대시보드는 혼자 만들었고, 이후 SeSAC 팀 최종 프로젝트 주제로 선정",
 body:'<table><tbody><tr><th>담당 범위</th><td>API 연동 · 서버리스 중계 · 자동 수집 · 대시보드 · 배포 (전부 혼자)</td></tr><tr><th>기술</th><td>JavaScript, Node.js 서버리스 함수, Vercel(서울 리전), GitHub Actions, Cloudflare DNS</td></tr><tr><th>연동 데이터</th><td>인천국제공항공사 운항 현황, 한국공항공사 운항·노선(공공데이터포털), ADS-B 실시간 위치, METAR·TAF 기상, 콜사인 노선</td></tr></tbody></table>'+
 '<div><h3>목표</h3><p>지금 인천공항에서 늦은 편 중 얼마가 앞 편에서 지연을 넘겨받았는지 실제 운항 자료로 보여 주고, 예측 모델 학습용 자료를 매일 끊기지 않게 쌓는 것.</p></div>'+
 '<div><h3>수행</h3><ul><li>외부 API를 서버리스 중계 함수 6개로 감싸 인증키는 서버 환경 변수에만 두고 브라우저에 노출하지 않음</li><li>GitHub Actions로 하루 두 번 전날 운항·기상 자료를 별도 브랜치에 자동 저장 (API가 3일 전까지만 조회돼 누락 시 수동 보충 경로 마련)</li><li>대시보드: 지연 전파 비율, 남은 편 예상 지연(앞 편 도착 + 최소 지상 시간 50분), 지연 원인·버퍼 분석</li></ul></div>'+
 '<div><h3>문제 → 개선</h3><table><tbody><tr><th>인증 오류</th><td>공공데이터포털이 HTTP 200을 돌려주면서 인증 오류는 응답 본문에만 담아 보내, 실패가 성공처럼 보였습니다. → 응답 본문의 오류 코드(게이트웨이 헤더, resultCode)를 확인하도록 바꿔 원인을 드러냈고, 키 값은 출력하지 않는 진단 모드로 보니 저장된 키가 여러 번 인코딩돼 있었습니다. → 키를 원래 형태로 정규화한 뒤 한 번만 인코딩해 요청하도록 수정</td></tr><tr><th>위치 데이터 끊김</th><td>ADS-B 소스 하나가 응답하지 않으면 지도가 비었습니다. → 소스 3곳에 동시에 요청하고, 실패하면 요청 제한 안에서 순서대로 재시도</td></tr></tbody></table></div>'+
 '<div><h3>결과</h3><p>실시간 대시보드를 개인 도메인으로 배포하고, 매일 자료 자동 수집을 운영 중입니다. 남은 편 예상 지연은 아직 단순 계산이라, 쌓은 자료로 모델을 학습하는 것이 다음 단계입니다.</p></div>',
 links:[["사이트","https://flight.kimchaeyeon.dev/airport"],["GitHub 저장소","https://github.com/k1mchaeyeon/icn-flight-delay-watch"]]},

 body:'<table><tbody><tr><th>담당 범위</th><td>수집 · 전처리 · 지표 설계 · 분석 · 시각화 · 대시보드 (전부 혼자)</td></tr><tr><th>기술</th><td>Python, pandas, matplotlib, Streamlit, Plotly(웹 버전)</td></tr><tr><th>데이터</th><td>국내인구이동, 주민등록인구, 전월세 실거래, 사업체조사, 지역별고용조사 (2021–2024, 25개 자치구)</td></tr></tbody></table>'+
 '<div><h3>목표</h3><p>"30대 순유출이 가장 많다"와 "2030이 서울로 들어온다"는 엇갈린 기사를, 연령대를 나눠 공공 데이터로 확인하는 것.</p></div>'+
 '<div><h3>문제 → 개선 (데이터 통합)</h3><ul><li>구마다 인구가 달라 순이동 인원으로는 비교가 안 됨 → 주민등록인구를 붙여 인구 1,000명당 순이동률로 통일</li><li>전세와 월세의 금액 기준이 다름 → 보증금 + 월세×12÷0.05로 전세 환산 후 자치구 중앙값</li><li>사업체 종사자수만으로는 주민의 고용 상태를 알 수 없음 → 거주지 고용률을 참고지표로 추가 (연령 구간 불일치는 명시)</li><li>최종: 5종 자료를 25개 구 × 4년 = 100행 하나의 표로 통합</li></ul></div>'+
 '<div class="d-nums"><div><strong>+36,561명</strong><span>2024년 20대 순유입</span></div><div><strong>−26,224명</strong><span>2024년 30대 순유출</span></div><div><strong>18개 구</strong><span>20대 유입 · 30대 유출</span></div></div>'+
 '<div><h3>결과</h3><table><tbody><tr><th>20대와 30대는 방향이 다를 것</th><td>지지</td></tr><tr><th>주거비가 높을수록 30대 순이동률이 낮을 것</th><td>지지되지 않음 (반대 방향, r = 0.625)</td></tr><tr><th>고용 여건이 좋을수록 20대 순이동률이 높을 것</th><td>부분 지지 (r = 0.620)</td></tr></tbody></table><p style="color:var(--muted);font-size:13px;margin-top:6px">상관관계는 개인의 이사 원인을 뜻하지 않는다는 한계를 함께 정리했습니다.</p></div>',

{id:"logiiq",nm:"AI 모델·LLM 데이터 연동 구조 설계",ds:"LogiIQ: YOLOv8 감지와 GPT 캐릭터를 붙인 3D 물류 교육 플랫폼 (졸업작품)",dt:"2025.06",kind:"project",cats:["ai","team"],img:"logiiq",
 meta:"졸업작품, 2024.09 – 2025.06, 4명 · 강조 구간: 서로 다른 시스템 간 데이터 연동과 비전 모델 학습 데이터",
 body:'<table><tbody><tr><th>담당 범위</th><td>Unity · Python(YOLO) · React 연동 구조 설계, YOLOv8 학습 데이터 구축과 학습, ChatGPT API 연동, 일정 관리</td></tr><tr><th>기술</th><td>Python(YOLOv8), ChatGPT API, Unity(C#) WebGL, React, Spring Boot, MariaDB</td></tr></tbody></table>'+
 '<div><h3>목표</h3><p>글과 영상으로 익히기 어려운 물류 공정을 웹 3D 물류센터에서 직접 해 보며 익히게 하는 것. 3D 시뮬레이션, 객체 감지, AI 캐릭터, 학습 대시보드가 한 흐름으로 데이터를 주고받아야 했습니다.</p></div>'+
 '<div><h3>수행</h3><ul><li><span class="mine">Unity WebGL ↔ Python(YOLOv8) ↔ React · Spring Boot 사이 데이터 연동 구조 설계</span></li><li>YOLOv8 학습 데이터 약 1만 5천 장 라벨링 · 증강(비정형 이미지 → 학습용 정형 라벨), 모델 학습</li><li>A* 경로 탐색에 YOLO 장애물 감지 결과를 넣어 AGV 자율주행</li><li>ChatGPT API로 학습자 질문 답변 · 미션 안내 AI 캐릭터 연동</li></ul></div>'+
 '<div><h3>문제 → 개선</h3><p>처음에는 VR로 시작했지만 팀 모두 VR 개발이 처음이라 구현에 시간이 몰려 교육 내용을 손대지 못했습니다. 목표는 초보자의 공정 이해이고 VR은 수단이라고 보고 웹 3D로 바꿨고, 아낀 시간을 YOLO 감지와 AI 캐릭터에 썼습니다.</p></div>'+
 '<div class="d-nums"><div><strong>42 → 85점</strong><span>초보 학습자 5명 평균 점수</span></div><div><strong>100%</strong><span>사용자 테스트 작업 성공률</span></div></div>'+
 '<div><h3>결과</h3><p>국제학술지 IJIBC 논문(제2저자, 데이터 연동 구조와 기술적 타당성 검증), IIBC 우수논문상, 2025 창업발명공모전 은상. AI 캐릭터가 프로젝트 정보 없이 답해 엉뚱한 답을 하던 한계가 이후 RAG 검색 프로젝트의 출발점이 됐습니다.</p></div>',
 links:[["시연 영상","https://youtu.be/GlBnGxDe_Iw"]]},
{id:"assac",nm:"클라우드 보안 로그 수집·알림 파이프라인",ds:"ASSAC: Spring PetClinic AWS 3-Tier 운영 환경, 엣지·보안과 차단 알림 담당",dt:"2026.10",kind:"project",cats:["cloud","team"],img:"assac",
 meta:"SeSAC 중간 프로젝트, 2026.09 – 2026.10, 5명 · 강조 구간: 로그 수집 → 가공 → 알림 자동화",
 body:'<table><tbody><tr><th>담당 범위</th><td>Route 53, CloudFront, WAF, ACM, 차단 알림 Lambda, 담당 리소스 Terraform 코드화</td></tr><tr><th>기술</th><td>AWS(Route 53, CloudFront, WAF, ACM, Lambda, CloudWatch Logs), Terraform, Discord</td></tr></tbody></table>'+
 '<div><h3>목표</h3><p>동물병원 진료 서비스를 요청이 VPC에 들어오기 전에 먼저 검사하고, 차단이나 이상이 생기면 사람이 로그를 찾기 전에 시스템이 먼저 알리도록 만드는 것.</p></div>'+
 '<div><h3>수행</h3><ul><li><span class="mine">WAF 차단 로그 → CloudWatch Logs 구독 필터 → Lambda(IP · 국가 · URI 추출) → Discord 알림</span>. 지표 경보 · 서버 증감 · GuardDuty 탐지도 Lambda가 정리해 Discord로 전달</li><li>WAF 관리형 규칙(일반 웹 공격, SQL Injection)과 IP당 5분 1,000건 요청 제한, 초과 시 직접 만든 429 안내 페이지</li><li>assac.cloud → CloudFront 연결, ACM으로 원본까지 HTTPS, 외부 ALB는 CloudFront 전용 IP만 허용</li></ul></div>'+
 '<div><h3>문제 → 개선</h3><p>7일간 CloudFront 요청 46,703건 중 캐시 응답은 16건(0.03%)이었습니다. 원인은 모든 경로가 캐시하지 않는 기본 동작 하나로 묶여 있고 응답에 Cache-Control 헤더가 없던 것. → 정적 경로는 1시간, 버전이 붙은 /webjars는 24시간, 동적 화면은 캐시 안 함으로 나누고, 바꾸기 전 설정은 JSON으로 백업 → 적용 후 정적 경로 6곳이 두 번째 요청부터 캐시로 응답.</p></div>'+
 '<div class="d-nums"><div><strong>212,565 / 42,212</strong><span>WAF 허용 / 차단 (14일)</span></div><div><strong>0.03% → 캐시 응답</strong><span>정적 경로 캐시 적중</span></div><div><strong>4팀 중 1위</strong><span>과정 내 최종 발표 (팀)</span></div></div>'+
 '<div><h3>결과와 남은 질문</h3><p>팀 결과로 부하 테스트 시간당 최대 18,735건 처리 중 p99 513ms를 유지했습니다. 알림은 자동으로 오지만 실제 공격인지 정상 사용자가 몰린 것인지는 결국 사람이 로그를 열어 판단해야 했고, 운영 로그를 AI로 먼저 해석하는 방법을 더 공부하고 싶은 이유가 됐습니다.</p></div>',
 links:[["사이트","https://assac.kimchaeyeon.dev"],["인프라 지도","https://notes.kimchaeyeon.dev/assac-infra-map/"]]},
{id:"morphing",nm:"실시간 원격 관제 통신 구조 설계·구현",ds:"(주)모핑아이 현장실습: 150mm 상수도관 소형 탐사 로봇의 통신·관제 SW",dt:"2026.02",kind:"career",cats:["ai","cloud"],img:"robot",
 meta:"(주)모핑아이 AI & 로봇 융합연구소, 2025.12 – 2026.02 · 강조 구간: 장비 ↔ 관제 서버 실시간 데이터 전송",
 body:'<table><tbody><tr><th>담당 범위</th><td>소형 로봇(B)의 관제 통신 SW 개발, 센서·영상·음향 수집 · 로봇 A·B 테스트 계획서와 모듈 상세설계 초안 작성 (관절형 로봇 A의 개발은 담당하지 않음)</td></tr><tr><th>기술</th><td>Python asyncio, TCP/UDP 소켓, Raspberry Pi Zero 2W, OV5640 카메라 ×2, MPU-9250 IMU, 하이드로폰</td></tr></tbody></table>'+
 '<div><h3>목표</h3><p>싱가포르 현지 배관 실증에 쓸 소구경(150mm) 상수도관 탐사 로봇에서 영상·음향·자세 데이터를 관제 PC로 실시간 전송하고 원격으로 제어하는 것. 관절형(A)과 소형(B) 두 로봇 중 파일럿 일정이 걸린 소형 로봇의 소프트웨어를 맡았습니다.</p></div>'+
 '<div><h3>수행</h3><ul><li><span class="mine">Python asyncio 기반 관제 구조: 관제 PC(Control Station)와 로봇(Mobile Agent)을 나누고, 제어 명령은 신뢰성 있는 TCP, 영상·음향·센서는 지연이 적은 UDP로 분리</span></li><li>카메라 2대(1920×1080) 프레임을 JPEG로 인코딩해 UDP로 전송, 패킷이 빠지면 재전송 없이 다음 프레임을 처리해 지연을 줄임</li><li>IMU 자세값 5ms 주기 수집, 하이드로폰 48kHz 음향 수집, 조명은 TCP 명령으로 제어</li><li>로봇 A·B 테스트 계획 · 절차서(FPS, 지연, 패킷 손실률 합격 기준), 모듈 상세설계 초안(관절형 A의 시리얼 패킷 설계 포함), 제어 API 명세서 작성</li></ul></div>'+

var FAN=["award","assac","logiiq","seoul","hack"];

var state={cat:"all",tab:"all",q:"",view:"list"};
var $=function(id){return document.getElementById(id)};
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* theme */
function applyTheme(t){
  if(t) document.documentElement.setAttribute("data-theme",t);
  var dark=t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  $("th-dark").setAttribute("aria-pressed",dark?"true":"false");
  $("th-light").setAttribute("aria-pressed",dark?"false":"true");
}
applyTheme(get("theme"));
$("th-light").onclick=function(){set("theme","light");applyTheme("light")};
$("th-dark").onclick=function(){set("theme","dark");applyTheme("dark")};

/* fan */
FAN.forEach(function(id){var it=ITEMS.find(function(x){return x.id===id});
  var b=document.createElement("button");b.type="button";b.setAttribute("aria-label",it.nm+" 자세히 보기");
  var im=document.createElement("img");im.src=IMG[it.img];im.alt="";b.appendChild(im);b.onclick=function(){open(it)};$("fan").appendChild(b);});

/* filters */
CATS.forEach(function(c){var li=document.createElement("li"),b=document.createElement("button");b.type="button";b.textContent=c[1];b.dataset.k=c[0];
  b.onclick=function(){state.cat=c[0];render()};li.appendChild(b);$("cats").appendChild(li);});
TABS.forEach(function(t){var b=document.createElement("button");b.type="button";b.textContent=t[1];b.dataset.k=t[0];b.onclick=function(){state.tab=t[0];render()};$("tabs").appendChild(b);});
$("q").addEventListener("input",function(e){state.q=e.target.value.trim().toLowerCase();render()});
document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement!==$("q")&&!$("dlg").open){e.preventDefault();$("q").focus();}});
$("v-list").onclick=function(){state.view="list";render()};
$("v-grid").onclick=function(){state.view="grid";render()};
$("count").textContent=ITEMS.length;

function match(it){
  if(state.cat!=="all"&&it.cats.indexOf(state.cat)<0) return false;
  if(state.tab!=="all"&&it.kind!==state.tab) return false;
  if(state.q&&(it.nm+" "+it.ds+" "+it.meta).toLowerCase().indexOf(state.q)<0) return false;
  return true;
}
function render(){
  document.querySelectorAll("#cats button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.k===state.cat?"true":"false")});
  document.querySelectorAll("#tabs button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.k===state.tab?"true":"false")});
  $("v-list").setAttribute("aria-pressed",state.view==="list"?"true":"false");
  $("v-grid").setAttribute("aria-pressed",state.view==="grid"?"true":"false");
  var out=$("out");out.className=state.view;out.innerHTML="";
  var rows=ITEMS.filter(match);
  $("empty").hidden=rows.length>0;
  rows.forEach(function(it){
    var li=document.createElement("li"),b=document.createElement("button");b.type="button";
    if(state.view==="list"){
      b.innerHTML='<span class="nm"></span><span class="ds"></span><span class="dt"></span>';
      b.children[0].textContent=it.nm;b.children[1].textContent=it.ds;b.children[2].textContent=it.dt;
    }else{
      var im=document.createElement("img");im.src=IMG[it.img];im.alt="";im.loading="lazy";b.appendChild(im);
      var n=document.createElement("span");n.className="nm";n.textContent=it.nm;b.appendChild(n);
      var d=document.createElement("span");d.className="dt";d.textContent=it.dt;b.appendChild(d);
    }
    b.onclick=function(){open(it)};li.appendChild(b);out.appendChild(li);
  });
}
render();

/* detail */
var dlg=$("dlg");
function open(it){
  $("d-date").textContent=it.dt;$("d-img").src=IMG[it.img];$("d-title").textContent=it.nm;$("d-meta").textContent=it.meta;
  $("d-body").innerHTML=it.body;
  var L=$("d-links");L.innerHTML="";
  it.links.forEach(function(l){var a=document.createElement("a");a.href=l[1];a.textContent=l[0];L.appendChild(a)});
  L.hidden=!it.links.length;
  if(typeof dlg.showModal==="function"){ if(!dlg.open) dlg.showModal(); } else dlg.setAttribute("open","");
  dlg.querySelector(".d-in").scrollTop=0;
}
$("d-close").onclick=function(){dlg.close()};
dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close()});
$("rand").onclick=function(){var pool=ITEMS.filter(match);if(!pool.length)pool=ITEMS;open(pool[Math.floor(Math.random()*pool.length)])};

/* copy email */
$("copy").onclick=function(){var b=this,t="kim.c.chaeyeon@gmail.com";
  function done(){b.textContent="메일 주소 복사됨";setTimeout(function(){b.textContent=t},1600)}
  try{navigator.clipboard.writeText(t).then(done,function(){sel(b)})}catch(e){sel(b)}};
function sel(el){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r)}
})();
</script>
